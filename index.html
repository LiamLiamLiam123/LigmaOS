<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ligma-OS</title>
<style>
:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#262626;--a:#00ff7b;--ac:#03140a;--ad:#004d1a;--t:#fff;--t2:#aaa;--bd:#ffffff17;--sh:0 18px 50px #000a}
[data-theme=light]{--bg:#eef1ef;--bg2:#fff;--bg3:#e3e8e5;--t:#111;--t2:#555;--bd:#0000001c;--sh:0 18px 50px #0004}
*{box-sizing:border-box;margin:0}
html{font-size:16px}
body{background:var(--bg);color:var(--t);font:400 .9rem/1.4 "Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;height:100vh;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#8884;border-radius:9px}
:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.btn,.tb button{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:.35rem .75rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;transition:.15s}
.btn:hover,.tb button:hover{border-color:var(--a)}
.btn.pri{background:var(--a);color:var(--ac);border-color:var(--a);font-weight:600}
.btn.dan{background:#c0392b;border-color:#c0392b;color:#fff}
.tb{display:flex;gap:.3rem;padding:.4rem;border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.tb button{padding:.3rem .45rem}
.in{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.35rem .6rem;width:100%;user-select:text}
.in:focus{border-color:var(--a);outline:0}
#boot,#lock,#setup,#off{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity .5s}
#boot .bar{width:200px;height:4px;background:var(--bg3);border-radius:4px;overflow:hidden}
#boot .bar i{display:block;height:100%;background:var(--a);animation:ld 1.1s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
.logo{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.6}}
#lock{background:radial-gradient(circle at 30% 20%,var(--ad),var(--bg) 60%);z-index:8000}
#lock .big{font-size:4.5rem;font-weight:200}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:1.6rem;width:min(92vw,380px);display:flex;flex-direction:column;gap:.7rem;box-shadow:var(--sh)}
.card label{font-size:.8rem;color:var(--t2)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#desktop{position:fixed;inset:0 0 3rem 0;background-size:cover}
#icons{position:absolute;inset:0}
.di{position:absolute;width:80px;padding:6px 2px;border-radius:10px;text-align:center;font-size:.75rem;cursor:default;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 1px 3px #000}
.di .ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--bg3),var(--bg2));border:1px solid var(--bd);display:grid;place-items:center;color:var(--a)}
.di:hover,.di.s{background:#ffffff18}
.di span{word-break:break-word;color:#fff}
#widget{position:absolute;right:18px;top:14px;text-align:right;text-shadow:0 2px 8px #000;pointer-events:none;color:#fff}
#widget b{font-size:2.6rem;font-weight:200;display:block;line-height:1}#widget span{color:#ddd}
#wins{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out;min-width:260px;min-height:160px}
.win.f{border-color:color-mix(in srgb,var(--a) 55%,transparent);box-shadow:var(--sh),0 0 0 1px color-mix(in srgb,var(--a) 25%,transparent)}
.win.min{display:none}.win.cl{opacity:0;transform:scale(.94);transition:.15s}.win.mx{border-radius:0}
.win.sn{transition:left .15s,top .15s,width .15s,height .15s}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
.wh{height:36px;display:flex;align-items:center;gap:.5rem;padding:0 .4rem 0 .8rem;background:var(--bg);flex:none;cursor:default;touch-action:none}
.wh .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}
.wh .ico{color:var(--a)}
.wh button{width:30px;height:26px;border:0;background:0;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--t2)}
.wh button:hover{background:var(--bg3);color:var(--t)}.wh button.x:hover{background:#c0392b;color:#fff}
.wb{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.rz{position:absolute;z-index:3;touch-action:none}.rz.r{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize}.rz.b{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize}.rz.c{right:-3px;bottom:-3px;width:14px;height:14px;cursor:nwse-resize}
#snap{position:fixed;background:color-mix(in srgb,var(--a) 15%,transparent);border:2px solid var(--a);border-radius:12px;z-index:5000;display:none;pointer-events:none}
#task{position:fixed;left:0;right:0;bottom:0;height:3rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;align-items:center;gap:.3rem;padding:0 .5rem;z-index:6000}
#task .sb,.tk{height:2.3rem;border:0;background:0;border-radius:8px;display:flex;align-items:center;gap:.45rem;padding:0 .7rem;cursor:pointer;color:var(--t);position:relative;max-width:11rem}
#task .sb{color:var(--a);padding:0 .6rem}
#task .sb:hover,.tk:hover{background:var(--bg3)}
.tk .ico{color:var(--a)}.tk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem}
.tk.f{background:var(--bg3)}.tk::after{content:"";position:absolute;bottom:2px;left:30%;right:30%;height:3px;border-radius:3px;background:var(--a);opacity:.4}.tk.f::after{opacity:1;left:20%;right:20%}
.tk.m{opacity:.6}
#tray{margin-left:auto;display:flex;align-items:center;gap:.2rem}
#tray button{border:0;background:0;color:var(--t);height:2.3rem;padding:0 .55rem;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:.3rem}
#tray button:hover{background:var(--bg3)}
#clk{text-align:right;font-size:.75rem;line-height:1.2}
#start{position:fixed;left:.5rem;bottom:3.5rem;width:min(94vw,520px);height:min(70vh,520px);background:var(--bg2);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);z-index:6500;display:none;flex-direction:column;padding:1rem;gap:.8rem}
#start.on{display:flex;animation:pop .15s}
#apps{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.4rem;align-content:start}
.ap{border:0;background:0;border-radius:10px;padding:.7rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;cursor:pointer;font-size:.8rem}
.ap:hover,.ap:focus{background:var(--bg3)}.ap .ico{width:44px;height:44px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;color:var(--a)}
.sf{display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--bd);padding-top:.7rem}.sf b{flex:1}
#pop{position:fixed;right:.5rem;bottom:3.5rem;width:290px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);z-index:6500;display:none;padding:1rem;max-height:60vh;overflow:auto}
#pop.on{display:block;animation:pop .15s}
.nt{padding:.5rem .6rem;border-radius:8px;background:var(--bg3);margin-bottom:.4rem;font-size:.8rem}.nt b{display:block;color:var(--a)}.nt.err b{color:#ff6b5b}
#toasts{position:fixed;right:.8rem;bottom:3.6rem;display:flex;flex-direction:column;gap:.4rem;z-index:7000;pointer-events:none}
.toast{pointer-events:auto;background:var(--bg2);border:1px solid var(--bd);border-left:3px solid var(--a);border-radius:10px;padding:.6rem .9rem;width:280px;box-shadow:var(--sh);animation:pop .2s}.toast.err{border-left-color:#ff6b5b}.toast b{display:block}.toast span{color:var(--t2);font-size:.8rem}
.cm{position:fixed;z-index:9500;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:.3rem;min-width:180px;box-shadow:var(--sh);animation:pop .1s}
.cm button{display:flex;width:100%;gap:.6rem;align-items:center;border:0;background:0;padding:.4rem .6rem;border-radius:6px;cursor:pointer;text-align:left}.cm button:hover{background:var(--ad)}.cm hr{border:0;border-top:1px solid var(--bd);margin:.3rem 0}
.modal{position:fixed;inset:0;background:#0009;z-index:9400;display:grid;place-items:center}
.box{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:1.2rem;width:min(92vw,420px);box-shadow:var(--sh);animation:pop .15s}
.box h3{margin-bottom:.6rem}.mb{margin-bottom:1rem;user-select:text}.mf{display:flex;gap:.5rem;justify-content:flex-end}
#off{z-index:9800;background:#000;color:#aaa}
/* apps */
.fa{display:flex;flex:1;min-height:0}.fs{width:150px;border-right:1px solid var(--bd);padding:.4rem;display:flex;flex-direction:column;gap:2px;overflow:auto}
.fs button{border:0;background:0;display:flex;gap:.5rem;align-items:center;padding:.4rem .5rem;border-radius:6px;cursor:pointer;text-align:left}.fs button:hover{background:var(--bg3)}
.fm{flex:1;display:flex;flex-direction:column;min-width:0}.lst{flex:1;overflow:auto;padding:.5rem;outline:0}
.lst.grid{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:.4rem;align-content:start}
.lst .it{border-radius:8px;padding:.4rem;cursor:default;border:1px solid transparent}.lst .it:hover{background:var(--bg3)}.lst .it.s{background:var(--ad);border-color:var(--a)}.lst .it.dt{border-color:var(--a)}
.lst.grid .it{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem}.lst.grid svg{width:36px;height:36px;color:var(--a)}.lst.grid i,.lst.grid u{display:none}.lst.grid b{font-weight:400;font-size:.75rem;word-break:break-word}
.lst.list .it{display:grid;grid-template-columns:20px 1fr 90px 160px;gap:.6rem;align-items:center}.lst.list svg{color:var(--a)}.lst.list i,.lst.list u{font-style:normal;text-decoration:none;color:var(--t2);font-size:.78rem}.lst.list b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.em{color:var(--t2);padding:1rem;text-align:center;grid-column:1/-1}.stt{padding:.3rem .8rem;border-top:1px solid var(--bd);color:var(--t2);font-size:.75rem}
.term{flex:1;background:#0a0a0a;color:#d8ffe8;font:.85rem/1.45 "SF Mono",Consolas,"Liberation Mono",monospace;padding:.6rem;overflow:auto;user-select:text}.term .ln{display:flex;gap:.5rem}.term input{flex:1;background:0;border:0;outline:0;font:inherit;color:#fff}.term .ps{color:var(--a);white-space:nowrap}.term pre{font:inherit;white-space:pre-wrap;word-break:break-word}.term .e{color:#ff7b6b}.term .d{color:var(--a)}
.ew{flex:1;position:relative;overflow:hidden;background:var(--bg)}.ew pre,.ew textarea{position:absolute;inset:0;margin:0;padding:.6rem;font:.85rem/1.5 "SF Mono",Consolas,monospace;white-space:pre;overflow:auto;border:0;tab-size:2;user-select:text}.ew pre{pointer-events:none;color:var(--t);overflow:hidden}.ew textarea{background:0;color:transparent;caret-color:var(--a);resize:none;outline:0}.ew textarea::selection{background:#00ff7b44;color:transparent}
.tc{color:#7f8c8d}.ts{color:#e5c07b}.tn{color:#d19a66}.tk2{color:var(--a)}
.fr{display:flex;gap:.3rem;padding:.4rem;border-bottom:1px solid var(--bd)}.fr input{max-width:160px}
.bw{flex:1;position:relative;background:#fff}.bw iframe{width:100%;height:100%;border:0;background:#fff}
.hm{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem;overflow:auto}.hm .in{max-width:420px}
.bm{display:flex;gap:.4rem;padding:.3rem .5rem;border-bottom:1px solid var(--bd);overflow:auto;font-size:.78rem}.bm button{border:0;background:var(--bg3);border-radius:6px;padding:.15rem .6rem;cursor:pointer;white-space:nowrap}
.nb{font-size:.75rem;color:var(--t2);padding:.25rem .6rem;border-bottom:1px solid var(--bd);display:flex;gap:.6rem;align-items:center}
.set{display:flex;flex:1;min-height:0}.set nav{width:160px;border-right:1px solid var(--bd);padding:.5rem;display:flex;flex-direction:column;gap:2px}.set nav button{border:0;background:0;padding:.5rem;border-radius:6px;text-align:left;cursor:pointer;display:flex;gap:.5rem;align-items:center}.set nav button.on,.set nav button:hover{background:var(--bg3)}
.sp{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.9rem}.sp h2{font-size:1.1rem}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.row.sp2{justify-content:space-between}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--t)}
.wp{width:110px;height:68px;border-radius:8px;border:2px solid var(--bd);cursor:pointer}.wp.on{border-color:var(--a)}
.tg{accent-color:var(--a);width:18px;height:18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:.3rem .8rem;user-select:text}.kv span:nth-child(odd){color:var(--t2)}
.cl{flex:1;display:flex;flex-direction:column;padding:.7rem;gap:.6rem}.cd{background:var(--bg);border-radius:10px;padding:.6rem .9rem;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.cd small{color:var(--t2);min-height:1.2em}.cd b{font-size:2rem;font-weight:300;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;flex:1}.ck button{border:0;border-radius:10px;background:var(--bg3);font-size:1.1rem;cursor:pointer}.ck button:hover{filter:brightness(1.25)}.ck .o{background:var(--ad)}.ck .q{background:var(--a);color:var(--ac)}
.hs{max-height:120px;overflow:auto;font-size:.78rem;color:var(--t2);border-top:1px solid var(--bd);padding-top:.4rem;user-select:text}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}.mc{background:var(--bg3);border-radius:10px;padding:.8rem}.mc b{font-size:1.5rem;font-weight:300;display:block}.mc small{color:var(--t2)}
.pg{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:.4rem}.pg i{display:block;height:100%;background:var(--a);transition:width .4s}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:.35rem .5rem;border-bottom:1px solid var(--bd)}
.sr{display:flex;gap:.8rem;align-items:center;background:var(--bg3);border-radius:12px;padding:.8rem}.sr .ico{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--a)}.sr div{flex:1}.sr small{color:var(--t2)}
.tag{font-size:.7rem;background:var(--ad);color:var(--a);border-radius:5px;padding:.05rem .4rem}
@media(max-width:700px){.fs{display:none}.tk span,#clk span{display:none}.set nav{width:52px}.set nav span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot"><div class="logo" id="bl"></div><div style="letter-spacing:.3em;font-weight:300">LIGMA-OS</div><div class="bar"><i></i></div><small style="color:var(--t2)">Ligma Technologies</small></div>
<div id="desktop"><div id="icons"></div><div id="widget"><b id="wt"></b><span id="wd"></span></div></div>
<div id="wins"></div><div id="snap"></div>

<div id="task"><button class="sb" id="sb" title="Start (Ctrl+Space)"></button><div id="run" style="display:flex;gap:.2rem;overflow:hidden"></div>
<div id="tray"><button id="tv" title="Volume"></button><button id="tn" title="Notifications"></button><button id="tl" title="Lock"></button><button id="clk"></button></div></div>

function lockScreen(){return new Promise(res=>{if($('#lock'))return;const l=el('div','',`<div class="big" id="lt"></div><div id="ld" style="color:var(--t2)"></div><div class="card" style="align-items:center;margin-top:1rem">${ic('user',36)}<b>${esc(P.name)}</b>${P.pin?'<input class="in" id="lp" type="password" inputmode="numeric" placeholder="Enter PIN" aria-label="PIN" autocomplete="off"><small id="le" style="color:#ff6b5b;min-height:1.2em"></small>':''}<button class="btn pri" id="lu">${P.pin?'Unlock':'Sign in'}</button></div>`);l.id='lock';document.body.append(l);
 const t=()=>{const d=new Date();$('#lt',l).textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#ld',l).textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})};t();const iv=setInterval(t,5000);
 const go=async()=>{if(P.pin&&await hash($('#lp',l).value)!==P.pin){$('#le',l).textContent='Incorrect PIN. Try again.';$('.card',l).classList.remove('shake');void $('.card',l).offsetWidth;$('.card',l).classList.add('shake');$('#lp',l).select();return}clearInterval(iv);l.style.opacity=0;setTimeout(()=>{l.remove();res()},300)};
 $('#lu',l).onclick=go;l.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')go()};($('#lp',l)||$('#lu',l)).focus()})}
function power(mode){closeMenus();const o=el('div','',mode==='reboot'?`<div class="logo">${LOGO()}</div><span>Restarting…</span>`:`${LOGO(56)}<b>Ligma-OS is shut down</b><button class="btn pri" id="on">${ic('power',16)} Power on</button>`);o.id='off';o.style.opacity=0;document.body.append(o);requestAnimationFrame(()=>o.style.opacity=1);
 if(mode==='reboot')setTimeout(()=>location.reload(),1200);else{$('#on',o).onclick=()=>location.reload();$('#on',o).focus()}}
function setup(){return new Promise(res=>{const s=el('div','',`<div class="card"><div class="row">${LOGO(48)}<div><b style="font-size:1.2rem">Set up Ligma-OS</b><br><small style="color:var(--t2)">Create your local profile</small></div></div><label for="su1">Username (letters and numbers)</label><input class="in" id="su1" value="liam" maxlength="20" autocomplete="off"><label for="su2">Display name</label><input class="in" id="su2" placeholder="Your name" maxlength="30"><label for="su3">PIN (optional, 4–8 digits)</label><input class="in" id="su3" type="password" inputmode="numeric" maxlength="8"><small id="se" style="color:#ff6b5b;min-height:1.2em"></small><button class="btn pri" id="sg" style="justify-content:center">Create profile</button><small style="color:var(--t2)">Everything stays in this browser. Nothing is sent anywhere.</small></div>`);s.id='setup';document.body.append(s);$('#su2',s).focus();
 $('#sg',s).onclick=async()=>{const u=$('#su1',s).value.trim().toLowerCase(),n=$('#su2',s).value.trim()||u,p=$('#su3',s).value,e=$('#se',s);if(!/^[a-z0-9]{1,20}$/.test(u))return e.textContent='Username must be 1–20 lowercase letters or numbers.';if(p&&!/^\d{4,8}$/.test(p))return e.textContent='PIN must be 4 to 8 digits.';P.user=u;P.name=n;P.pin=p?await hash(p):'';savePrefs();s.style.opacity=0;setTimeout(()=>{s.remove();res()},400)};s.onkeydown=e=>{if(e.key==='Enter')$('#sg',s).click()}})}
function startDesktop(){UP=true;FS.seed();desk();tick();$('#su').textContent=P.name;Start.render();FS.subs.add(()=>desk());
 if(!FS.ok)toast('Storage unavailable','IndexedDB is blocked, so files will not persist after a refresh.',1);
 if(!P.welcomed){P.welcomed=true;savePrefs();WM.open('welcome')}P.startup.filter(k=>P.installed.includes(k)).forEach(k=>WM.open(k))}
addEventListener('keydown',e=>{if(!UP||$('#lock'))return;const k=e.key.toLowerCase();
 if(e.ctrlKey&&!e.altKey&&!e.shiftKey&&k===' '){e.preventDefault();Start.toggle()}
 else if(e.ctrlKey&&e.altKey&&k==='t'){e.preventDefault();WM.open('terminal')}
 else if(e.ctrlKey&&e.shiftKey&&k==='e'){e.preventDefault();WM.open('files')}
 else if(e.altKey&&(k==='tab'||k==='q')){e.preventDefault();WM.cycle()}
 else if(k==='escape'){closeMenus()}
 else if(e.ctrlKey&&k==='s'){e.preventDefault();const t=WM.top();t&&t.save&&t.save()}},true);
addEventListener('resize',()=>UP&&desk());
setInterval(()=>UP&&tick(),1000);
(async()=>{applyPrefs();await FS.init();await sleep(1200);const b=$('#boot');b.style.opacity=0;setTimeout(()=>b.remove(),500);
 if(!P.user)await setup();else if(P.pin)await lockScreen();FS.seed&&0;startDesktop()})();
</script>
</body>
</html>
